[project]
name = "data_sparsity"
version = "0.1.0"
description = "Tools for generating and comparing array and tabular data reading performances"
authors = [{ name="Enrico Milanese", email="enrico.milanese@whoi.edu" }]
readme = "README.md"
license = {text = "Apache 2.0"}
requires-python = ">=3.12"
dependencies = [
    "dask",
    "matplotlib>=3.8.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "xarray>=2023.1.0",
    "netCDF4>=1.6.0",
    "jupyterlab"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["data_sparsity*"]
